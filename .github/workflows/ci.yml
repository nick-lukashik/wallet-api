name: ci

# The org reusable workflows (nick-lukashik/.github, docs/ci.md): pnpm verify
# with every service container and the image, then the gitops deploy PR.

on:
    pull_request:
    push:
        branches: [master]

permissions: {}

jobs:
    # Job id "ci" gives the required check "ci / verify".
    ci:
        uses: nick-lukashik/.github/.github/workflows/build.yml@v1.1.0 # the first with github-packages
        permissions:
            contents: read
            packages: write
        with:
            kind: api
            # Exported as TEST_DATABASE_URL, TEST_REDIS_URL, TEST_RABBITMQ_URL; the
            # integration tests use them instead of Testcontainers (test/global-setup.ts).
            services: postgres,redis,rabbitmq
            # @nick-lukashik/auth and /contracts from GitHub Packages.
            github-packages: true
            publish: ${{ !github.event.repository.is_template }}

    # Pushed image on master (verify green): a PR in gitops with the new digest.
    deploy:
        needs: ci
        if: github.ref == 'refs/heads/master' && needs.ci.outputs.digest != ''
        uses: nick-lukashik/.github/.github/workflows/deploy-pr.yml@v1
        permissions:
            contents: read
            packages: read
        with:
            image: ${{ needs.ci.outputs.image }}
            digest: ${{ needs.ci.outputs.digest }}
        # Only what deploy-pr.yml needs (least privilege, no secrets: inherit).
        secrets:
            DEPLOYER_APP_ID: ${{ secrets.DEPLOYER_APP_ID }}
            DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
            OPS_TELEGRAM_TOKEN: ${{ secrets.OPS_TELEGRAM_TOKEN }}
