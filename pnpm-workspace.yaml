# Only these dependencies may run install scripts; telemetry and optional native addons are off.
allowBuilds:
    "@swc/core": true
    esbuild: true
    "@scarf/scarf": false
    cpu-features: false
    protobufjs: false
    ssh2: false
minimumReleaseAgeExclude:
    - "@nick-lukashik/auth@0.1.0"
    - "@nick-lukashik/contracts@0.1.0"
# Dev tools only: patched versions of what Dependabot flags (esbuild through drizzle-kit, minimatch through glob).
overrides:
    "@esbuild-kit/core-utils>esbuild": 0.25.12
    "glob@10>minimatch": 11.0.3
